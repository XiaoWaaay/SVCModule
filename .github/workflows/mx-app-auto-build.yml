name: MX_APP Auto Build

on:
  push:
    branches: [ "**" ]
    paths:
      - "MX_APP/**"
      - ".github/workflows/mx-app-auto-build.yml"
  pull_request:
    paths:
      - "MX_APP/**"
      - ".github/workflows/mx-app-auto-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MX_APP

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses and install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Unsigned Release APK
        run: ./gradlew assembleRelease -PunsignedRelease=true --stacktrace

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mx-app-apks
          path: |
            MX_APP/app/build/outputs/apk/debug/app-debug.apk
            MX_APP/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
