name: Build KPM + Android APK

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.0.12077973"
      GRADLE_VERSION: "8.7"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (AGP 8.1 compatible)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"

      - name: Build KPM + APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          KP_DIR: ${{ github.workspace }}/KernelPatch
          GRADLE_VERSION: ${{ env.GRADLE_VERSION }}
        run: |
          ./scripts/ci/build_kpm_and_apk.sh

      - name: Upload KPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: svc-monitor-kpm
          path: kpm/svc_monitor.kpm

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: svc-monitor-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
