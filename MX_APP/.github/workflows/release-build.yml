name: Android Release Build

on:
  push:
    branches: [ codex/translate-chinese-text-to-english ]
    paths:
      - '**.rs'
      - '**.kt'
      - '**.java'
      - '**.gradle'
      - '**.gradle.kts'
      - 'gradle/**'
      - 'app/src/main/rust/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      build_signed_release:
        description: Build signed release APK (requires a valid keystore)
        required: false
        default: true
        type: boolean
      build_unsigned_release:
        description: Build unsigned release APK
        required: false
        default: true
        type: boolean
      build_debug:
        description: Build debug APK
        required: false
        default: true
        type: boolean

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Protocol Buffers compiler
      uses: arduino/setup-protoc@v3
      with:
        version: '33.x'
        repo-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Install Rust targets
      run: |
        rustup target add aarch64-linux-android
        rustup target add x86_64-linux-android

    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@main
      with:
        ndk-version: r26d
        add-to-path: true
        link-to-sdk: true

    - name: Set NDK environment variables
      run: |
        echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
        echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Cache Cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-registry-

    - name: Cache Cargo build (release)
      uses: actions/cache@v4
      with:
        path: |
          app/src/main/rust/target
        key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-release-

    - name: Clean Rust incremental builds
      run: |
        find app/src/main/rust -type d -name incremental -exec rm -rf {} + 2>/dev/null || true
        find app/src/main/rust/target -name "*.rlib" -mtime +7 -delete 2>/dev/null || true

    - name: Decode Release Keystore
      run: |
        if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > ${{ github.workspace }}/release.keystore
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Validate Release Keystore
      id: validate_keystore
      shell: bash
      run: |
        KEYSTORE_TYPE="${{ secrets.RELEASE_KEYSTORE_TYPE }}"
        if [ -z "$KEYSTORE_TYPE" ]; then
          KEYSTORE_TYPE="JKS"
        fi

        if [ ! -s "${{ github.workspace }}/release.keystore" ]; then
          echo "valid=false" >> "$GITHUB_OUTPUT"
          echo "reason=missing-file" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if keytool -list \
          -keystore "${{ github.workspace }}/release.keystore" \
          -storepass "${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" \
          -storetype "$KEYSTORE_TYPE" >/dev/null 2>&1; then
          echo "valid=true" >> "$GITHUB_OUTPUT"
          echo "reason=ok" >> "$GITHUB_OUTPUT"
        else
          echo "valid=false" >> "$GITHUB_OUTPUT"
          echo "reason=unreadable-keystore" >> "$GITHUB_OUTPUT"
        fi

    - name: Resolve requested build variants
      id: build_flags
      shell: bash
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          BUILD_SIGNED="${{ inputs.build_signed_release }}"
          BUILD_UNSIGNED="${{ inputs.build_unsigned_release }}"
          BUILD_DEBUG="${{ inputs.build_debug }}"
        else
          BUILD_SIGNED="true"
          BUILD_UNSIGNED="true"
          BUILD_DEBUG="true"
        fi

        echo "signed=$BUILD_SIGNED" >> "$GITHUB_OUTPUT"
        echo "unsigned=$BUILD_UNSIGNED" >> "$GITHUB_OUTPUT"
        echo "debug=$BUILD_DEBUG" >> "$GITHUB_OUTPUT"

    - name: Clean build outputs once
      if: steps.build_flags.outputs.signed == 'true' || steps.build_flags.outputs.unsigned == 'true' || steps.build_flags.outputs.debug == 'true'
      run: ./gradlew clean --stacktrace

    - name: Build Signed Release APK
      id: build_signed_release
      if: steps.build_flags.outputs.signed == 'true' && steps.validate_keystore.outputs.valid == 'true'
      continue-on-error: true
      run: ./gradlew assembleRelease --stacktrace
      env:
        RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEYSTORE_TYPE: ${{ secrets.RELEASE_KEYSTORE_TYPE }}

    - name: Build Unsigned Release APK
      if: steps.build_flags.outputs.unsigned == 'true'
      run: ./gradlew assembleRelease -PunsignedRelease=true --stacktrace

    - name: Build Debug APK
      if: steps.build_flags.outputs.debug == 'true'
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Signed Release APK
      if: steps.build_signed_release.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-release-signed
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

    - name: Upload Unsigned Release APK
      if: steps.build_flags.outputs.unsigned == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned
        path: app/build/outputs/apk/release/*unsigned*.apk
        if-no-files-found: error

    - name: Upload Debug APK
      if: steps.build_flags.outputs.debug == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Report skipped signed release
      if: steps.build_flags.outputs.signed == 'true' && steps.validate_keystore.outputs.valid != 'true'
      run: echo "Skipping signed release build because the release keystore is missing or invalid."
